<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavesh Gole | Data Engineer</title>
    
    <!-- Importing Fonts to match the clean Sans-Serif and the stylish Serif italic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
    
    <style>
        /* Base Colors and Setup based on the screenshot */
        :root {
            --bg-color: rgb(255, 255, 255);
            --text-main: rgb(10, 10, 10);
            --text-muted: #666666;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Public Sans', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3vw;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .header-center {
            background-color: #111;
            color: #fff;
            padding: 0.4rem 0.9rem;
            border-radius: 999px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-center::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #4ade80; /* Green dot */
            border-radius: 50%;
        }

        .header-right {
            /* Placeholder for the dark mode icons in the screenshot */
            width: 50px; 
        }

        /* Main Content Layout */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10vw;
            max-width: 1400px;
            margin-top: -10vh; /* Slight adjustment to center perfectly */
        }

        /* Massive Interactive Headline */
        h1 {
            font-size: clamp(3rem, 7vw, 6.5rem);
            font-weight: 500;
            line-height: 1.1;
            margin: 0 0 2rem 0;
            letter-spacing: -0.03em;
            outline: none;
        }

        /* The outlined "effortless" style */
        .effortless-style {
            font-family: 'Newsreader', serif;
            font-style: italic;
            font-weight: 400;
            -webkit-text-stroke: 1.5px var(--text-main);
            color: transparent;
            position: relative;
            display: inline-block;
        }

        /* The multiplayer cursor tag hovering over the text */
        .cursor-tag {
            position: absolute;
            background-color: var(--text-main);
            color: var(--bg-color);
            font-family: 'Public Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            top: -15px;
            right: -25px;
            pointer-events: none;
            font-style: normal;
            letter-spacing: normal;
            -webkit-text-stroke: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Subtext paragraph */
        p.bio {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Links matching the screenshot */
        .links {
            display: flex;
            gap: 2rem;
            font-weight: 500;
            margin-bottom: 4rem;
            font-size: 0.95rem;
        }

        .links a {
            color: var(--text-main);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .links a:hover {
            opacity: 0.6;
        }

        /* Bottom hint text */
        .sub-hint {
            font-size: 0.75rem;
            color: #a3a3a3;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Hides the ugly blue outline when typing in the headline */
        [contenteditable="true"]:focus {
            outline: none;
        }

        @media (max-width: 768px) {
            header { padding: 1.5rem 1.5rem; }
            main { padding: 0 1.5rem; }
            .header-center { display: none; } /* Hide status on small screens for cleaner look */
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 600;">Bhavesh Gole</div>
        <div class="header-center">Available for full-time roles</div>
        <div class="header-right"></div>
    </header>

    <main>
        <!-- The H1 has contenteditable="true" so you can literally click and type in it, matching the original site's functionality -->
        <h1 contenteditable="true" spellcheck="false">
            Data pipelines that<br>
            feel <span class="effortless-style" contenteditable="false">effortless.<span class="cursor-tag">Bhavesh</span></span>
        </h1>

        <p class="bio">
            Data Engineer specializing in DaaS.<br>
            Right now: scalable enterprise integration at Deloitte.
        </p>

        <div class="links">
            <a href="#work">View work ↗</a>
            <a href="mailto:YOUR_EMAIL@example.com">Get in touch ↗</a>
        </div>

        <div class="sub-hint">
            That's live. Click the headline and type.
        </div>
    </main>

</body>
</html>
